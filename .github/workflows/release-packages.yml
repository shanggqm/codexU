name: Build release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package (macOS builds must match Resources/Info.plist)"
        required: true
        type: string
      platform:
        description: "Platforms to build (Windows can be prepared before release metadata)"
        required: true
        type: choice
        default: all
        options:
          - all
          - macos
          - windows
      candidate_run:
        description: "Verify frozen packages from this run ID; empty builds a new candidate"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          INPUT_PLATFORM: ${{ inputs.platform }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
          else
            version="${REF_NAME#v}"
          fi
          version="${version#v}"
          if [[ -n "$CANDIDATE_RUN" ]]; then
            [[ "$CANDIDATE_RUN" =~ ^[0-9]+$ ]] || exit 1
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid release version: $version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'windows'
    needs: resolve-version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install validation dependencies
        run: brew install ripgrep zstd
      - name: Build and verify macOS DMGs
        if: inputs.candidate_run == ''
        run: make release-package VERSION="${{ needs.resolve-version.outputs.version }}"
      - name: Record macOS candidate source
        if: inputs.candidate_run == ''
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          pathlib.Path('dist/manifest-macos.json').write_text(json.dumps({
              'version': os.environ['VERSION'], 'source_sha': os.environ['GITHUB_SHA']
          }, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Download frozen macOS candidate
        if: inputs.candidate_run != ''
        uses: actions/download-artifact@v4
        with:
          name: codexu-macos-${{ needs.resolve-version.outputs.version }}
          path: dist
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify frozen source and final release metadata
        if: inputs.candidate_run != ''
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os
          with open('dist/manifest-macos.json', encoding='utf-8') as handle:
              assert json.load(handle)['version'] == os.environ['VERSION']
          PY
          source_sha="$(python3 -c 'import json; print(json.load(open("dist/manifest-macos.json", encoding="utf-8"))["source_sha"])')"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          git diff --exit-code "$source_sha" HEAD -- Sources Resources Makefile scripts .github/workflows/release-packages.yml
          make release-check VERSION="$VERSION"
      - name: Upload macOS artifacts
        if: inputs.candidate_run == ''
        uses: actions/upload-artifact@v4
        with:
          name: codexu-macos-${{ needs.resolve-version.outputs.version }}
          path: |
            dist/codexU-${{ needs.resolve-version.outputs.version }}-mac-arm64.dmg
            dist/codexU-${{ needs.resolve-version.outputs.version }}-mac-arm64.dmg.sha256
            dist/codexU-${{ needs.resolve-version.outputs.version }}-mac-x86_64.dmg
            dist/codexU-${{ needs.resolve-version.outputs.version }}-mac-x86_64.dmg.sha256
            dist/manifest-macos.json
          if-no-files-found: error
      - name: Upload macOS acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codexu-macos-evidence-${{ needs.resolve-version.outputs.version }}
          path: |
            build/memory-risk/report.md
            .local-artifacts/macos-local-readers/*
          if-no-files-found: warn

  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'macos'
    needs: resolve-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and verify Windows installers
        if: inputs.candidate_run == ''
        shell: pwsh
        run: .\scripts\build-windows-release.ps1 -Version "${{ needs.resolve-version.outputs.version }}"
      - name: Download frozen Windows candidate
        if: inputs.candidate_run != ''
        uses: actions/download-artifact@v4
        with:
          name: codexu-windows-${{ needs.resolve-version.outputs.version }}
          path: dist/windows
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Windows candidate
        if: inputs.candidate_run == ''
        uses: actions/upload-artifact@v4
        with:
          name: codexu-windows-${{ needs.resolve-version.outputs.version }}
          path: dist/windows/*
          if-no-files-found: error
  windows-installation:
    if: github.event_name == 'workflow_dispatch' && inputs.platform != 'macos'
    needs: [resolve-version, windows]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        installer: [msi, nsis]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: codexu-windows-${{ needs.resolve-version.outputs.version }}
          path: dist/windows
          run-id: ${{ inputs.candidate_run || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify isolated installation and upgrade
        shell: pwsh
        run: .\scripts\test-windows-installers.ps1 -Version "${{ needs.resolve-version.outputs.version }}" -Installer "${{ matrix.installer }}"
      - name: Upload installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codexu-installation-${{ matrix.installer }}-${{ needs.resolve-version.outputs.version }}
          path: .local-artifacts/installer-acceptance/*
          if-no-files-found: warn

  verify:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all'
    needs: [resolve-version, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: codexu-macos-${{ needs.resolve-version.outputs.version }}
          path: dist
          run-id: ${{ inputs.candidate_run || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: codexu-windows-${{ needs.resolve-version.outputs.version }}
          path: dist/windows
          run-id: ${{ inputs.candidate_run || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify all installers and checksums
        run: bash scripts/check-cross-platform-release-assets.sh "${{ needs.resolve-version.outputs.version }}" dist
      - name: Upload verified release bundle
        uses: actions/upload-artifact@v4
        with:
          name: codexu-release-${{ needs.resolve-version.outputs.version }}
          path: |
            dist/codexU-${{ needs.resolve-version.outputs.version }}-mac-arm64.dmg*
            dist/codexU-${{ needs.resolve-version.outputs.version }}-mac-x86_64.dmg*
            dist/windows/codexU-${{ needs.resolve-version.outputs.version }}-windows-x86_64.msi*
            dist/windows/codexU-${{ needs.resolve-version.outputs.version }}-windows-x86_64-setup.exe*
          if-no-files-found: error
