name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install history parser dependency
        run: brew install zstd
      - name: Build
        run: make build
      - name: History index and compressed session tests
        run: build/codexU.app/Contents/MacOS/codexU --self-test-history-index
      - name: Model pricing catalog and calculation tests
        run: build/codexU.app/Contents/MacOS/codexU --self-test-model-pricing
      - name: Runtime executable detection and fast source tests
        run: build/codexU.app/Contents/MacOS/codexU --self-test-runtime-fast-sources
      - name: Palette package and rendering tests
        run: build/codexU.app/Contents/MacOS/codexU --self-test-palettes
      - name: Menu bar rendering tests
        run: build/codexU.app/Contents/MacOS/codexU --self-test-status-item
      - name: Particle animation tests
        run: build/codexU.app/Contents/MacOS/codexU --self-test-particle-animation
      - name: Rate limit tests
        run: build/codexU.app/Contents/MacOS/codexU --self-test-rate-limits
      - name: Statistics time zone tests
        run: build/codexU.app/Contents/MacOS/codexU --self-test-statistics-time-zone

  windows-rust-format:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Windows Rust formatting
        working-directory: windows
        run: cargo fmt --all -- --check
      - name: Test Windows Rust workspace
        working-directory: windows
        run: cargo test --workspace

  windows-web:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: windows/apps/codexu-tauri/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/apps/codexu-tauri/web/package-lock.json
      - name: Install Windows Web dependencies
        run: npm ci
      - name: Build Windows Web
        run: npm run build
      - name: Test Windows Web contracts
        run: npm run test:contracts
